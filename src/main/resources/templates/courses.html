<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:border-radius="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/head :: head('Courses')}"></head>

<body>
<!-- preloader start -->
<div class="preloader">
    <img src="/images/preloader.gif" alt="preloader" th:src="@{/images/preloader.gif}">
</div>
<!-- preloader end -->

<!-- header -->
<div th:replace="fragments/headerAndFooter :: header"></div>
<!-- /header -->

<!-- page title -->
<section class="page-title-section overlay" data-background="images/backgrounds/page-title.jpg">
    <div class="container">
        <div class="row">
            <div class="col-md-8">
                <ul class="list-inline custom-breadcrumb mb-2">
                    <li class="list-inline-item"><a class="h2 text-primary font-secondary" href="index.html"
                                                    th:href="@{/}">Home</a>
                    </li>
                    <li class="list-inline-item text-white h3 font-secondary nasted"
                        th:text="${enrolledView == true} ? 'My Courses' : 'Our Courses'">Our Courses</li>
                </ul>
                <p class="text-lighten mb-0"
                   th:text="${enrolledView == true} ? 'Courses you are enrolled in.' : 'Browse and enroll in available courses.'">
                    Browse and enroll in available courses.</p>
            </div>
        </div>
    </div>
</section>
<!-- /page title -->

<!-- courses -->
<section class="courses-list pb40">
    <div class="container">
        <div class="row">
            <div class="col-12 shadow_box courses-list-main">
                <div class="courses_list_heading courses-filter-heading">
                    <form th:unless="${enrolledView == true}" class="courses-filter-form" action="#" th:action="@{/courses}"
                          method="post" th:object="${filterOptions}">
                        <div class="courses-filter-toolbar">
                            <input type="search" class="courses-filter-input" name="title"
                                   placeholder="Search by title" th:field="*{title}"/>

                            <select class="courses-filter-select" th:field="*{teacherId}">
                                <option value="">All teachers</option>
                                <option th:each="teacher : ${teachers}"
                                        th:value="${teacher.id}"
                                        th:text="${teacher.firstName + ' ' + teacher.lastName}">Teacher</option>
                            </select>

                            <select class="courses-filter-select" th:field="*{topicId}">
                                <option value="">All topics</option>
                                <option th:each="topic : ${topics}"
                                        th:value="${topic.id}"
                                        th:text="${topic.topicName}">Topic</option>
                            </select>

                            <select class="courses-filter-select" th:field="*{sortBy}">
                                <option value="">Sort by</option>
                                <option value="title">Title</option>
                                <option value="rating">Rating</option>
                            </select>

                            <select class="courses-filter-select" th:field="*{sortOrder}">
                                <option value="">Sort order</option>
                                <option value="asc">Ascending</option>
                                <option value="desc">Descending</option>
                            </select>

                            <div class="courses-filter-actions">
                                <button class="btn btn-primary btn-sm courses-filter-submit" type="submit">Search</button>
                                <a class="btn btn-outline-secondary btn-sm courses-filter-reset" th:href="@{/courses}">Reset filters</a>
                            </div>
                        </div>
                    </form>

                    <p th:if="${enrolledView == true}" class="courses-filter-meta mb-0">
                        <span class="color-dark" th:text="${enrolledCount}">0</span>
                        <span th:text="${enrolledCount == 1 ? ' enrolled course' : ' enrolled courses'}"> enrolled courses</span>
                        <span class="courses-filter-meta-sep">·</span>
                        <a th:href="@{/courses}">Browse all courses</a>
                    </p>
                    <p th:unless="${enrolledView == true}" class="courses-filter-meta mb-0">
                        <span class="color-dark" th:text="${coursesCount}">0</span> Courses
                        <span class="courses-filter-meta-sep">·</span>
                        <span class="color-dark" th:text="${lectureCount}">0</span> Lectures
                    </p>
                </div>

                <!--Courses-->
                <div th:if="${enrolledView == true and #lists.isEmpty(coursesFiltered)}" class="lectures-empty-state p-4 text-center">
                    <i class="ti-book lecture-notes-empty-icon"></i>
                    <p class="mb-2">You are not enrolled in any courses yet.</p>
                    <a class="btn btn-primary btn-sm" th:href="@{/courses}">Browse courses</a>
                </div>

                <div th:unless="${enrolledView == true and #lists.isEmpty(coursesFiltered)}"
                     class="row justify-content-center courses-grid">
                    <!-- course item -->
                    <br>
                    <div th:each="course,index : ${coursesFiltered}" class="col-lg-4 col-sm-6 mb-5">
                        <a class="card p-0 border-primary rounded-0 hover-shadow course-list-card h-100 text-decoration-none"
                           th:href="@{/courses/{publicId}(publicId=${course.publicId})}">
                            <div class="course-card-thumb">
                                <img class="course-card-img" src="#"
                                     th:src="${course.topic.imgUrl}"
                                     th:attr="onerror=|this.onerror=null;this.src='@{${defaultCourseImage}}';|"
                                     th:alt="${course.title}" alt="">
                            </div>
                            <div class="card-body">
                                <div class="course-card-meta d-flex justify-content-between align-items-center mb-2">
                                    <span class="ti-calendar text-color"
                                          th:text="${' ' + course.startingDate}">02-14-2018</span>
                                    <ul class="list-inline mb-0 course-card-stars">
                                        <li th:each="star : ${#numbers.sequence(1, 5)}"
                                            class="list-inline-item">
                                            <i class="fa fa-star"
                                               th:classappend="${star <= course.avgRating.intValue()} ? ' color-golden' : ' color-gray'"></i>
                                        </li>
                                    </ul>
                                </div>
                                <div class="course-card-content">
                                    <p class="mb-1"
                                       th:text="${course.teacher.firstName + ' ' + course.teacher.lastName}">Teacher</p>
                                    <h5 class="course-card-title" th:text="${course.title}">Course title</h5>
                                    <h6 class="text-muted mb-0" th:text="${course.topic.topicName}">Topic</h6>
                                </div>
                                <span class="btn btn-primary btn-sm course-list-card-btn mt-3">View Course</span>
                            </div>
                        </a>
                    </div>
                    <!-- /course list -->
                </div>
            </div>
        </div>
    </div>
</section>
<!-- footer -->
<div th:replace="fragments/headerAndFooter :: footer"></div>
<!-- /footer -->


</body>
</html>
