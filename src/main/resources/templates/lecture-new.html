<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Create Lecture</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <link rel="stylesheet" href="/plugins/bootstrap/bootstrap.min.css" th:href="@{/plugins/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" href="/plugins/themify-icons/themify-icons.css" th:href="@{/plugins/themify-icons/themify-icons.css}">
    <link rel="stylesheet" href="/plugins/slick/slick.css" th:href="@{/plugins/slick/slick.css}">
    <link rel="stylesheet" href="/plugins/animate/animate.css" th:href="@{/plugins/animate/animate.css}">
    <link rel="stylesheet" href="/plugins/aos/aos.css" th:href="@{/plugins/aos/aos.css}">
    <link rel="stylesheet" href="/plugins/venobox/venobox.css" th:href="@{/plugins/venobox/venobox.css}">
    <link href="/css/style.css" rel="stylesheet" th:href="@{/css/style.css}">
    <link href="/css/styleUsers.css" rel="stylesheet" th:href="@{/css/styleUsers.css}">
    <link rel="shortcut icon" href="/images/favicon.png" type="image/x-icon" th:href="@{/images/favicon.png}">
</head>
<body>

<div class="preloader">
    <img src="/images/preloader.gif" alt="preloader" th:src="@{/images/preloader.gif}">
</div>

<div th:replace="fragments/headerAndFooter :: header"></div>

<section class="section-sm">
    <div class="container lecture-form-page">
        <div class="lecture-form-header">
            <a class="lecture-form-back"
               th:href="@{/courses/{coursePublicId}/lectures(coursePublicId=${coursePublicId})}">
                <i class="ti-arrow-left"></i> Back to lectures
            </a>
            <h2 class="lecture-form-title">Create a new lecture</h2>
            <p class="lecture-form-subtitle"
               th:if="${course != null}"
               th:text="|Add a lecture to ${course.title}. You can upload an assignment after creating it.|">
                Add a lecture to this course.
            </p>
            <p class="lecture-form-subtitle" th:unless="${course != null}">
                Add a title and video link for your new lecture.
            </p>
        </div>

        <div class="lecture-form-panel">
            <form th:action="@{/courses/{coursePublicId}/lectures/new(coursePublicId=${coursePublicId})}"
                  th:object="${lecture}" method="post" novalidate>

                <div class="lecture-form-group">
                    <label for="lectureTitle" class="lecture-form-label">Lecture title</label>
                    <input type="text" class="form-control lecture-form-input" id="lectureTitle"
                           th:field="*{title}" placeholder="e.g. Introduction to Java"
                           maxlength="50" required>
                    <p class="lecture-form-hint">Between 5 and 50 characters.</p>
                    <p class="lecture-form-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
                </div>

                <div class="lecture-form-group">
                    <label for="lectureVideoUrl" class="lecture-form-label">Video URL</label>
                    <input type="url" class="form-control lecture-form-input" id="lectureVideoUrl"
                           th:field="*{videoUrl}" placeholder="https://www.youtube.com/embed/..."
                           maxlength="500" required>
                    <p class="lecture-form-hint">Paste a YouTube embed link or other video URL for this lecture.</p>
                    <p class="lecture-form-error" th:if="${#fields.hasErrors('videoUrl')}" th:errors="*{videoUrl}"></p>
                </div>

                <div class="lecture-form-actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="ti-check"></i> Create lecture
                    </button>
                    <a class="btn btn-outline-secondary"
                       th:href="@{/courses/{coursePublicId}/lectures(coursePublicId=${coursePublicId})}">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</section>

<div th:replace="fragments/headerAndFooter :: footer"></div>

<script src="/plugins/jQuery/jquery.min.js" th:src="@{/plugins/jQuery/jquery.min.js}"></script>
<script src="/plugins/bootstrap/bootstrap.min.js" th:src="@{/plugins/bootstrap/bootstrap.min.js}"></script>
<script src="/plugins/slick/slick.min.js" th:src="@{/plugins/slick/slick.min.js}"></script>
<script src="/plugins/aos/aos.js" th:src="@{/plugins/aos/aos.js}"></script>
<script src="/plugins/venobox/venobox.min.js" th:src="@{/plugins/venobox/venobox.min.js}"></script>
<script src="/plugins/filterizr/jquery.filterizr.min.js" th:src="@{/plugins/filterizr/jquery.filterizr.min.js}"></script>
<script src="/js/script.js" th:src="@{/js/script.js}"></script>

</body>
</html>
