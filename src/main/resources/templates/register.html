<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Register')}"></head>
<body class="auth-page-body">

<div th:replace="~{fragments/headerAndFooter :: header}"></div>

<section class="auth-page">
    <div class="auth-card">
        <h2>Create account</h2>
        <form th:action="@{/auth/register}" th:object="${register}" method="post">
            <input type="text" class="form-control" id="signupFirstname" placeholder="First name"
                   th:field="*{firstName}" required autocomplete="given-name">
            <div class="text-danger small mb-2" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}">First name error</div>

            <input type="text" class="form-control" id="signupLastname" placeholder="Last name"
                   th:field="*{lastName}" required autocomplete="family-name">
            <div class="text-danger small mb-2" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">Last name error</div>

            <input type="email" class="form-control" id="signupEm" placeholder="Email"
                   th:field="*{email}" required autocomplete="email">
            <div class="text-danger small mb-2" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</div>

            <input type="password" class="form-control" id="signupPassword" placeholder="Password"
                   th:field="*{password}" required autocomplete="new-password">
            <div class="text-danger small mb-2" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</div>

            <input type="password" class="form-control" id="signupPasswordConfirm" placeholder="Confirm password"
                   th:field="*{passwordConfirm}" required autocomplete="new-password">
            <div class="text-danger small mb-2" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}">Confirm error</div>

            <button type="submit" class="btn btn-primary">Sign up</button>
        </form>
        <p class="auth-card-footer mb-0">
            Already have an account? <a th:href="@{/auth/login}">Sign in</a>
        </p>
    </div>
</section>

<div th:replace="~{fragments/headerAndFooter :: footer}"></div>
</body>
</html>
