<body>
<!-- preloader start -->
<div class="preloader">
    <img src="/images/preloader.gif" alt="preloader" th:src="@{/images/preloader.gif}">
</div>
<!-- preloader end -->

<!-- header -->
<div th:replace="fragments/headerAndFooter :: header"></div>
<!-- /header -->

<!-- page title -->
<section class="page-title-section overlay" data-background="images/backgrounds/page-title.jpg">
    <div class="container">
        <div class="row">
            <div class="col-md-8">
                <ul class="list-inline custom-breadcrumb mb-2">
                    <li class="list-inline-item"><a class="h2 text-primary font-secondary" href="index.html"
                                                    th:href="@{/}">Home</a>
                    </li>
                    <li class="list-inline-item text-white h3 font-secondary nasted">Browse My Courses</li>
                </ul>
            </div>
        </div>
    </div>
</section>
<!-- /page title -->

<!-- courses -->
<section class="courses-list pb40">
    <div class="container">
        <div class="row">
            <div class="col-md-12 col-xl-8 col-xl-12 shadow_box">
                <div class="row courses_list_heading">
                    <div class="col-xl-4 p0">
                        <div class="instructor_search_result style2">
                            <a style="text-align: center" href="course-single.html" class="btn btn-primary btn-sm"
                               th:href="@{/courses/new}">Create A New Course</a>
                        </div>
                    </div>
                </div>

                <!--Courses-->
                <div class="row justify-content-center">
                    <!-- course item -->
                    <br>
                    <div th:each="course : ${singleTeacherCourses}" class="col-lg-4 col-sm-6 mb-5">
                        <div class="card p-0 border-primary rounded-0 hover-shadow teacher-course-card">
                            <div class="course-card-thumb">
                                <img class="course-card-img" src="#"
                                     th:src="*{course.getTopic().getImgUrl()}"
                                     th:alt="${course.getTitle()}" alt="">
                            </div>
                            <div class="card-body">
                                <div class="course-card-meta d-flex justify-content-between align-items-center mb-2">
                                    <span class="ti-calendar text-color"
                                          th:text="${' ' + course.getStartingDate()}">02-14-2018</span>
                                    <ul class="list-inline mb-0 course-card-stars">
                                        <li th:each="star : ${#numbers.sequence(1, 5)}"
                                            class="list-inline-item">
                                            <i class="fa fa-star"
                                               th:classappend="${star <= course.getAvgRating().intValue()} ? ' color-golden' : ' color-gray'"></i>
                                        </li>
                                    </ul>
                                </div>
                                <div class="course-card-content">
                                    <p class="mb-1"
                                       th:text="${course.getTeacher().getFirstName()} + ' ' + ${course.getTeacher().getLastName()}"></p>
                                    <h5 class="course-card-title" th:text="${course.getTitle()}"></h5>
                                    <h6 class="text-muted mb-0" th:text="${course.getTopic().getTopicName()}"></h6>
                                </div>
                                <div class="course-card-actions d-flex flex-wrap mt-3">
                                    <a class="btn btn-primary btn-sm"
                                       th:href="@{/courses/{id}/lectures(id=${course.getId()})}">Manage Lectures</a>
                                    <form th:action="@{/courses/{id}/update/status(id=${course.getId()})}"
                                          method="post" class="d-inline">
                                        <button class="btn btn-outline-primary btn-sm" type="submit"
                                                th:text="${course.getStatus()}">Published</button>
                                    </form>
                                    <a class="btn btn-outline-secondary btn-sm"
                                       th:href="@{/courses/{id}/update(id=${course.getId()})}">
                                        <i class="fa fa-edit"></i> Edit
                                    </a>
                                    <a class="btn btn-outline-danger btn-sm"
                                       th:href="@{/courses/{id}/delete(id=${course.getId()})}"
                                       onclick="return confirm('Delete this course?');">
                                        <i class="fa fa-trash"></i> Delete
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- /course list -->
                </div>
            </div>
        </div>
    </div>
</section>
<!-- footer -->
<div th:replace="fragments/headerAndFooter :: footer"></div>
<!-- /footer -->

<!-- jQuery -->

<!-- Main Script -->

<script>
    //Call jQuery before below code
    $('.main-btn').click(function () {
        $('.search-description').slideToggle(100);
    });
    $('.search-description li').click(function () {
        var target = $(this).html();
        var toRemove = 'By ';
        var newTarget = target.replace(toRemove, '');
        //remove spaces
        newTarget = newTarget.replace(/\s/g, '');
        $(".search-large").html(newTarget);
        $('.search-description').hide();
        $('.main-input').hide();
        newTarget = newTarget.toLowerCase();
        $('.main-' + newTarget).show();
    });
    $('#main-submit-mobile').click(function () {
        $('#main-submit').trigger('click');
    });
    $(window).resize(function () {
        replaceMatches();
    });

    function replaceMatches() {
        var width = $(window).width();
        if (width < 516) {
            $('.main-location').attr('value', 'City or postal code');
        } else {
            $('.main-location').attr('value', 'Search by city or postal code');
        }
    };
    replaceMatches();

    function clearText(thefield) {
        if (thefield.defaultValue === thefield.value) {
            thefield.value = ""
        }
    }

    function replaceText(thefield) {
        if (thefield.value === "") {
            thefield.value = thefield.defaultValue
        }
    }
</script>

</body>
