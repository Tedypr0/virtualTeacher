<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Homeworks')}"></head>

<body>
<div class="preloader">
    <img src="/images/preloader.gif" alt="preloader" th:src="@{/images/preloader.gif}">
</div>

<div th:replace="~{fragments/headerAndFooter :: header}"></div>

<section class="page-title-section overlay" th:attr="data-background=@{/images/backgrounds/page-title.jpg}">
    <div class="container">
        <div class="row">
            <div class="col-md-8">
                <ul class="list-inline custom-breadcrumb mb-2">
                    <li class="list-inline-item"><a class="h2 text-primary font-secondary" th:href="@{/}">Home</a></li>
                    <li class="list-inline-item text-white h3 font-secondary nasted"
                        th:text="${session.isTeacher} ? 'Student Homeworks' : 'My Homeworks'">Homeworks</li>
                </ul>
                <p class="text-lighten mb-0"
                   th:text="${session.isTeacher} ? 'Review and grade submitted homeworks.' : 'View your submitted homeworks and grades.'">Homeworks</p>
            </div>
        </div>
    </div>
</section>

<section class="section-sm">
    <div class="container">

        <div class="mb-4">
            <a href="javascript:history.back()" class="btn btn-outline-primary">
                <i class="ti-arrow-left mr-2"></i> Back
            </a>
        </div>

        <!-- Empty states -->
        <div th:if="${session.isTeacher and homeworksByTeacherId.size() == 0}"
             class="lecture-notes-panel text-center py-5">
            <i class="ti-clipboard" style="font-size: 2.5rem; color: #ccc;"></i>
            <p class="mt-3 text-muted">Nobody has submitted any homeworks yet.</p>
        </div>
        <div th:if="${!session.isTeacher and !session.isAdmin and homeworksByUserId.size() == 0}"
             class="lecture-notes-panel text-center py-5">
            <i class="ti-clipboard" style="font-size: 2.5rem; color: #ccc;"></i>
            <p class="mt-3 text-muted">You have not submitted any homeworks yet.</p>
        </div>

        <!-- Teacher view -->
        <div th:if="${session.isTeacher and homeworksByTeacherId.size() > 0}"
             class="lecture-notes-panel p-0">
            <div class="table-responsive">
                <table class="table mb-0">
                    <thead class="thead-light">
                        <tr>
                            <th>Course</th>
                            <th>Lecture</th>
                            <th>Student</th>
                            <th>Homework</th>
                            <th>Grade</th>
                        </tr>
                    </thead>
                    <tbody th:each="homework : ${homeworksByTeacherId}">
                        <tr>
                            <td th:text="${homework.lecture.course.title}">Course</td>
                            <td th:text="${homework.lecture.title}">Lecture</td>
                            <td th:text="${homework.user.firstName + ' ' + homework.user.lastName}">Student</td>
                            <td>
                                <a th:href="@{${homework.homeworkUrl}}" download class="btn btn-outline-primary btn-sm">
                                    <i class="ti-download mr-1"></i> Download
                                </a>
                            </td>
                            <td>
                                <form th:action="@{/users/homeworks/{publicId}/grade(publicId=${homework.publicId})}" method="post"
                                      class="d-flex align-items-center" style="gap: 0.5rem;">
                                    <select name="grade" class="form-control form-control-sm" style="width: auto;">
                                        <option value="2">2</option>
                                        <option value="2.5">2.5</option>
                                        <option value="3">3</option>
                                        <option value="3.5">3.5</option>
                                        <option value="4">4</option>
                                        <option value="4.5">4.5</option>
                                        <option value="5">5</option>
                                        <option value="5.5">5.5</option>
                                        <option value="6">6</option>
                                    </select>
                                    <button type="submit" class="btn btn-primary btn-sm">Set Grade</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Student view -->
        <div th:if="${!session.isTeacher and !session.isAdmin and homeworksByUserId.size() > 0}"
             class="lecture-notes-panel p-0">
            <div class="table-responsive">
                <table class="table mb-0">
                    <thead class="thead-light">
                        <tr>
                            <th>Course</th>
                            <th>Lecture</th>
                            <th>Homework</th>
                            <th>Grade</th>
                        </tr>
                    </thead>
                    <tbody th:each="homework : ${homeworksByUserId}">
                        <tr>
                            <td th:text="${homework.lecture.course.title}">Course</td>
                            <td th:text="${homework.lecture.title}">Lecture</td>
                            <td>
                                <a th:href="@{${homework.homeworkUrl}}" download class="btn btn-outline-primary btn-sm">
                                    <i class="ti-download mr-1"></i> Download
                                </a>
                            </td>
                            <td>
                                <span th:text="${homework.grade == 0 ? 'Not graded yet' : homework.grade}"
                                      th:classappend="${homework.grade == 0} ? 'text-muted' : 'font-weight-bold text-success'">
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</section>

<div th:replace="~{fragments/headerAndFooter :: footer}"></div>
</body>
</html>
