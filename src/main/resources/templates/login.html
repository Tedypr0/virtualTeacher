<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Login')}"></head>
<body class="auth-page-body">

<div th:replace="fragments/headerAndFooter :: header"></div>

<section class="auth-page">
    <div class="auth-card">
        <h2>Sign in</h2>
        <form th:action="@{/auth/login}" th:object="${login}" method="post">
            <input type="email" class="form-control" id="email" name="email" placeholder="Email"
                   th:field="*{email}" required autocomplete="username">
            <input type="password" class="form-control" id="password" name="password" placeholder="Password"
                   th:field="*{password}" required autocomplete="current-password"
                   pattern="^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&amp;])[A-Za-z\d@$!%*#?&amp;]{8,}$">
            <div class="alert alert-warning py-2 mb-2" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</div>
            <div class="alert alert-warning py-2 mb-2" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</div>
            <button type="submit" class="btn btn-primary">Sign in</button>
        </form>
        <p class="auth-card-footer mb-0">
            No account yet? <a th:href="@{/auth/register}">Register</a>
        </p>
    </div>
</section>

<div th:replace="fragments/headerAndFooter :: footer"></div>
</body>
</html>
