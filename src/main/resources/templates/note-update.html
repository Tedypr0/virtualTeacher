<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Edit Note</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/plugins/bootstrap/bootstrap.min.css" th:href="@{/plugins/bootstrap/bootstrap.min.css}">
  <link rel="stylesheet" href="/plugins/themify-icons/themify-icons.css" th:href="@{/plugins/themify-icons/themify-icons.css}">
  <link href="/css/styleUsers.css" rel="stylesheet" th:href="@{/css/styleUsers.css}">
</head>
<body>

<div class="container notes-page">
  <div class="lecture-notes-panel" style="max-width: 640px; margin-top: 2rem;">
    <h3 class="lecture-notes-title">Edit Note</h3>
    <p class="lecture-notes-hint">Update your note for this lecture.</p>
    <form th:action="@{/courses/{coursePublicId}/lectures/{lecturePublicId}/notes/{notePublicId}/update(coursePublicId=${coursePublicId}, lecturePublicId=${lecturePublicId}, notePublicId=${notePublicId})}"
          th:object="${note}" method="post">
      <textarea class="lecture-notes-textarea form-control" th:field="*{note}"
                placeholder="Start typing your notes here…"
                rows="10" maxlength="2000"></textarea>
      <p class="lecture-notes-error error" th:if="${#fields.hasErrors('note')}" th:errors="*{note}"></p>
      <div class="note-card-actions" style="margin-top: 1rem;">
        <button type="submit" class="btn btn-primary">
          <i class="ti-save"></i> Save changes
        </button>
        <a class="btn btn-outline-secondary"
           th:href="@{/courses/{coursePublicId}/lectures/{lecturePublicId}(coursePublicId=${coursePublicId}, lecturePublicId=${lecturePublicId})}">Cancel</a>
      </div>
    </form>
  </div>
</div>

</body>
</html>
